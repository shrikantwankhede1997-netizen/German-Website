        function App() {

            const [activeDeck, setActiveDeck] = React.useState(vocabData);
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [knownCards, setKnownCards] = React.useState([]);
            const [learningCards, setLearningCards] = React.useState([]);

            const [isFlipped, setIsFlipped] = React.useState(false);
            const [showHint, setShowHint] = React.useState(false);
            const [isReversed, setIsReversed] = React.useState(false);
            const [disableFlipAnim, setDisableFlipAnim] = React.useState(false); // NEW: Prevents flip animation on swipe
            
            // Physics / Drag State
            const [dragX, setDragX] = React.useState(0);
            const [isDragging, setIsDragging] = React.useState(false);
            const [swipeAnim, setSwipeAnim] = React.useState(null); // 'left' or 'right'
            const dragStartX = React.useRef(null);

            // Helper to instantly reset flip without showing a rotating animation
            const instantResetFlip = () => {
                setDisableFlipAnim(true);
                setIsFlipped(false);
                setTimeout(() => setDisableFlipAnim(false), 50);
            };

            const toggleFlip = () => {
                // Ensure we don't accidentally re-enable animation if it was disabled
                setDisableFlipAnim(false); 
                setIsFlipped(!isFlipped);
            };
            
            const toggleHint = (e) => { e.stopPropagation(); setShowHint(!showHint); };

            const handleBgClick = (e) => {
                if (e.target.closest('button')) return; // Ignore buttons
                if (Math.abs(dragX) > 10) return; // Ignore if it was a drag
                toggleFlip();
            };

            const handleAnswer = (isKnown) => {
                if (swipeAnim) return; // Prevent double clicks
                
                // Save to history for undo feature
                setHistory(prev => [...prev, {
                    card: activeDeck[currentIndex],
                    index: currentIndex,
                    wasKnown: isKnown
                }]);

                setSwipeAnim(isKnown ? 'right' : 'left');
                
                // Wait for elegant swipe away animation
                setTimeout(() => {
                    if (isKnown) {
                        setKnownCards(prev => [...prev, activeDeck[currentIndex]]);
                    } else {
                        setLearningCards(prev => [...prev, activeDeck[currentIndex]]);
                    }

                    if (currentIndex < activeDeck.length - 1) {
                        setCurrentIndex(prev => prev + 1);
                        setShowHint(false);
                        instantResetFlip(); // Resets flip silently!
                    } else {
                        setIsFinished(true);
                    }
                    
                    // Instantly reset position 
                    setSwipeAnim(null);
                    setDragX(0);
                }, 300); 
            };

            const handleUndo = (e) => {
                if (e) e.stopPropagation();
                if (history.length === 0 || swipeAnim) return;

                const lastAction = history[history.length - 1];
                setHistory(prev => prev.slice(0, -1)); // pop last action

                // Remove from respective pile
                if (lastAction.wasKnown) {
                    setKnownCards(prev => prev.slice(0, -1));
                } else {
                    setLearningCards(prev => prev.slice(0, -1));

                setIsFinished(false);
                setShowHint(false);
                instantResetFlip(); // Reset flip silently!

                setKnownCards([]);
                setLearningCards([]);
                setHistory([]);
                setIsFinished(false);
                setShowHint(false);
                instantResetFlip();
            };

                const shuffled = [...activeDeck];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                setActiveDeck(shuffled);
                setCurrentIndex(0);
                setKnownCards([]);
                setLearningCards([]);
                setHistory([]);
                setIsFinished(false);
                setShowHint(false);
                instantResetFlip();
            };

                setIsReversed(!isReversed);
                instantResetFlip();
            };

                setKnownCards([]);
                setLearningCards([]);

                setIsFinished(false);
                setShowHint(false);

                if (!isDragging || swipeAnim || dragStartX.current === null) return;
                const deltaX = clientX - dragStartX.current;
                setDragX(deltaX);
            };

            const handleDragEnd = () => {
                if (!isDragging || swipeAnim) return;
                setIsDragging(false);
                dragStartX.current = null;
                
                const threshold = 100; // px
                if (dragX > threshold) {

                dragStyle.transition = 'transform 0.3s ease-out';

                dragStyle.transform = `translateX(0px) rotate(0deg)`;
                dragStyle.transition = 'transform 0.3s ease-out';

            };

                                        strokeLinecap="round"
                                    />
                                </svg>
                                <div className="absolute inset-0 flex items-center justify-center">
                                    <span className="text-4xl font-bold text-[#001d35]">{score}%</span>
                                </div>
                            </div>
                            
                            <div className="flex justify-between items-center bg-[#f8f9fa] rounded-2xl p-4 mb-4 border border-gray-100 relative z-10">
                                <span className="font-semibold text-gray-600 flex items-center"><span className="w-3 h-3 rounded-full bg-[#c4eed0] border border-[#a3d9b6] mr-2"></span> Gewusst</span>
                                <span className="text-xl font-bold text-[#001d35]">{knownCards.length}</span>
                            </div>
                            <div className="flex justify-between items-center bg-[#f8f9fa] rounded-2xl p-4 mb-8 border border-gray-100 relative z-10">
                                <span className="font-semibold text-gray-600 flex items-center"><span className="w-3 h-3 rounded-full bg-[#f9dedc] border border-[#f0c3c0] mr-2"></span> Noch lernen</span>
                                <span className="text-xl font-bold text-[#001d35]">{learningCards.length}</span>
                            </div>

                            <div className="space-y-3 relative z-10">
                                {history.length > 0 && (
                                    <button 
                                        onClick={handleUndo}
                                        className="w-full bg-white text-gray-600 border border-gray-200 font-semibold py-4 rounded-full hover:bg-gray-50 transition-colors shadow-sm"
                                    >
                                        <i className="fas fa-undo mr-2"></i> Letzte Karte rückgängig
                                    </button>
                                )}
                                {learningCards.length > 0 && (
                                    <button 
                                        onClick={handleStudyRemaining}
                                        className="w-full bg-[#2563eb] text-white font-semibold py-4 rounded-full hover:bg-blue-700 transition-colors shadow-sm"
                                    >
                                        Noch zu lernende wiederholen
                                    </button>
                                )}
                                <button 
                                    onClick={handleRestartAll}
                                    className="w-full bg-[#e9f1fb] text-[#001d35] font-semibold py-4 rounded-full hover:bg-[#d3e3fd] transition-colors shadow-sm"
                                >
                                    Ganzes Set neu starten
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            const card = activeDeck[currentIndex];

            return (
                <div 
                    className="flex flex-col items-center justify-center min-h-[100dvh] p-4 sm:p-8 w-full max-w-screen-xl mx-auto bg-[#f8f9fa] font-sans overflow-hidden cursor-pointer"
                    onClick={handleBgClick} 
                >
                    
                    {/* Top Toolbar */}
                    <div className="flex justify-between items-center w-full max-w-lg lg:max-w-xl mb-6">
                        {/* Progress Header */}
                        <div className="bg-white rounded-full px-5 py-2 text-[#001d35] font-medium shadow-sm border border-gray-200 text-sm sm:text-base flex items-center gap-2">
                            <i className="fas fa-layer-group text-[#2563eb]"></i>
                            {currentIndex + 1} / {activeDeck.length}
                        </div>
                        
                        {/* Controls */}
                        <div className="flex gap-2 sm:gap-3">
                            <button 
                                onClick={handleUndo}
                                disabled={history.length === 0}
                                className={`w-10 h-10 sm:w-11 sm:h-11 rounded-full flex items-center justify-center text-sm sm:text-base transition-all shadow-sm active:scale-90 border ${history.length === 0 ? 'bg-gray-100 border-gray-200 text-gray-300 cursor-not-allowed' : 'bg-white border-gray-200 text-gray-500 hover:text-blue-600 hover:bg-gray-50'}`}
                                title="Rückgängig"
                            >
                                <i className="fas fa-undo"></i>
                            </button>
                            <button 
                                onClick={(e) => { e.stopPropagation(); handleReverse(); }}
                                className={`w-10 h-10 sm:w-11 sm:h-11 rounded-full flex items-center justify-center text-sm sm:text-base transition-all shadow-sm active:scale-90 border ${isReversed ? 'bg-[#d3e3fd] border-[#a8c7fa] text-[#001d35]' : 'bg-white border-gray-200 text-gray-500 hover:text-[#2563eb] hover:bg-gray-50'}`}
                                title="Sprache wechseln"
                            >
                                <i className="fas fa-exchange-alt"></i>
                            </button>
                            <button 
                                onClick={(e) => { e.stopPropagation(); handleShuffle(); }}
                                className="w-10 h-10 sm:w-11 sm:h-11 bg-white text-gray-500 border border-gray-200 rounded-full flex items-center justify-center text-sm sm:text-base hover:bg-gray-50 hover:text-[#2563eb] transition-all shadow-sm active:scale-90"
                                title="Mischen"
                            >
                                <i className="fas fa-random"></i>
                            </button>
                            <button 
                                onClick={(e) => { e.stopPropagation(); handleRestartAll(); }}
                                className="w-10 h-10 sm:w-11 sm:h-11 bg-white text-gray-500 border border-gray-200 rounded-full flex items-center justify-center text-sm sm:text-base hover:bg-gray-50 hover:text-[#2563eb] transition-all shadow-sm active:scale-90"
                                title="Neu starten"
                            >
                                <i className="fas fa-redo"></i>
                            </button>
                        </div>
                    </div>

                    {/* Flashcard Container (with Deck logic attached) */}
                    <div className="perspective-1000 w-full max-w-lg lg:max-w-xl mb-8 h-[60vh] max-h-[28rem] min-h-[24rem] relative">
                        
                        {/* Static Underlying Deck Effect 2 */}
                        {currentIndex + 2 < activeDeck.length && (
                            <div className="absolute inset-0 w-full h-full bg-white border border-gray-200 rounded-[2.5rem] transform scale-[0.92] translate-y-6 opacity-40 z-0"></div>
                        )}
                        
                        {/* Static Underlying Deck Effect 1 */}
                        {currentIndex + 1 < activeDeck.length && (
                            <div className="absolute inset-0 w-full h-full bg-white border border-gray-200 shadow-sm rounded-[2.5rem] transform scale-[0.96] translate-y-3 opacity-80 z-0"></div>
                        )}

                        {/* Top Draggable Card */}
                        <div 
                            style={{ ...dragStyle, zIndex: 10 }}
                            className="w-full h-full relative"
                            onMouseDown={(e) => handleDragStart(e.clientX)}
                            onMouseMove={(e) => handleDragMove(e.clientX)}
                            onMouseUp={handleDragEnd}
                            onMouseLeave={handleDragEnd}
                            onTouchStart={(e) => handleDragStart(e.touches[0].clientX)}
                            onTouchMove={(e) => handleDragMove(e.touches[0].clientX)}
                            onTouchEnd={handleDragEnd}
                        >
                            <div 
                                className="relative w-full h-full transform-style-3d shadow-sm hover:shadow border border-gray-200 rounded-[2.5rem]"
                                style={flipStyle}
                            >
                                {/* Front Face */}
                                <div className="absolute inset-0 backface-hidden bg-white flex flex-col items-center justify-center rounded-[2.5rem] p-6 sm:p-8 text-center">
                                    <span className="absolute top-6 left-8 text-xs sm:text-sm font-semibold text-gray-500 uppercase tracking-wider flex items-center bg-gray-50 px-3 py-1 rounded-full border border-gray-100">
                                        <i className={`fas ${isReversed ? 'fa-globe-americas text-[#1a73e8]' : 'fa-language text-[#1a73e8]'} mr-2`}></i>
                                        {isReversed ? 'Englisch' : 'Deutsch'}
                                    </span>
                                    
                                    <div className="w-full flex-grow flex items-center justify-center px-2 mt-8 mb-4">
                                        <h2 className="text-3xl sm:text-4xl lg:text-5xl font-bold leading-tight text-[#001d35] break-words hyphens-auto w-full" style={{ wordBreak: 'break-word' }}>
                                            {isReversed ? card.back : card.front}
                                        </h2>
                                    </div>
                                    <p className="text-gray-400 pb-4 text-sm font-medium">Tippen zum Umdrehen</p>
                                </div>

                                {/* Back Face (Explicitly rotated via Tailwind utility to prevent mirroring) */}
                                <div className="absolute inset-0 backface-hidden [transform:rotateY(180deg)] bg-white flex flex-col items-center justify-center rounded-[2.5rem] p-6 sm:p-8 text-center overflow-y-auto custom-scrollbar">
                                    <span className="absolute top-6 right-8 text-xs sm:text-sm font-semibold text-gray-500 uppercase tracking-wider hidden sm:flex items-center bg-gray-50 px-3 py-1 rounded-full border border-gray-100">
                                        {isReversed ? 'Deutsch' : 'Englisch'}
                                    </span>
                                    
                                    <div className="w-full flex-grow flex flex-col items-center justify-center pt-12 sm:pt-4">
                                        <h2 className="text-2xl sm:text-3xl font-bold text-[#001d35] mb-6 leading-tight break-words hyphens-auto w-full px-2" style={{ wordBreak: 'break-word' }}>
                                            {isReversed ? card.front : card.back}
                                        </h2>
                                        
                                        <div className="w-full bg-[#f8f9fa] rounded-2xl p-4 mb-4 border border-gray-100 shadow-sm text-left">
                                            <span className="text-xs text-[#2563eb] font-bold uppercase tracking-widest mb-2 flex items-center"><i className="fas fa-comment-dots mr-2"></i>Beispiel</span>
                                            <p className="text-base sm:text-lg text-[#001d35] font-medium italic leading-relaxed">
                                                "{card.example}"
                                            </p>
                                        </div>
                                    </div>
                                    
                                    {/* Hint Section */}
                                    <div className="mt-2 w-full pb-2 z-10" onClick={(e) => e.stopPropagation()}>
                                        <button 
                                            onClick={toggleHint}
                                            className="text-xs sm:text-sm bg-white hover:bg-gray-50 border border-gray-200 transition-colors rounded-full px-4 py-2 font-medium text-gray-600 focus:outline-none shadow-sm active:scale-95"
                                        >
                                            <i className={`fas fa-${showHint ? 'eye-slash' : 'lightbulb'} text-yellow-500 mr-2`}></i>
                                            {showHint ? 'Tipp ausblenden' : 'Tipp anzeigen'}
                                        </button>
                                        
                                        {showHint && (
                                            <div className="mt-4 p-4 bg-yellow-50 rounded-2xl border border-yellow-100 text-sm italic text-gray-800 shadow-sm text-left leading-relaxed">
                                                {card.hint}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Bottom Action Controls */}
                    <div className="flex items-center justify-center gap-6 sm:gap-12 w-full max-w-sm relative z-20">
                        <button 
                            onClick={(e) => { e.stopPropagation(); handleAnswer(false); }}
                            className="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-[#f9dedc] text-[#8c1d18] flex items-center justify-center hover:bg-[#f2b8b5] transition-all shadow-sm hover:shadow-md active:scale-90"
                            title="Noch lernen (Links wischen)"
                        >
                            <i className="fas fa-times text-2xl sm:text-3xl"></i>
                        </button>
                        
                        <div className="flex flex-col items-center text-gray-400 font-bold tracking-widest text-xs pointer-events-none">
                            <span>SWIPE</span>
                            <div className="flex gap-2 mt-1">
                                <i className="fas fa-chevron-left text-[10px]"></i>
                                <i className="fas fa-chevron-right text-[10px]"></i>
                            </div>
                        </div>

                        <button 
                            onClick={(e) => { e.stopPropagation(); handleAnswer(true); }}
                            className="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-[#c4eed0] text-[#0d652d] flex items-center justify-center hover:bg-[#a3d9b6] transition-all shadow-sm hover:shadow-md active:scale-90"
                            title="Gewusst (Rechts wischen)"
                        >
                            <i className="fas fa-check text-2xl sm:text-3xl"></i>
                        </button>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
